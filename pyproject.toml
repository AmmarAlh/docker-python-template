[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "app"
version = "0.1.0"
description = "Dockerized Python app with Ruff, Pyright, Pylint, pytest, and VS Code Dev Containers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "ruff>=0.13.0",
  "pytest>=8.0.0",
  "pylint>=4.0.0",
  "pre-commit>=4.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "I",
  "B",
  "UP",
  "SIM",
  "C4",
  "ARG",
  "RUF",
]
ignore = [
  "E501",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.pylint.main]
py-version = "3.11"
ignore = [".venv", "build", "dist"]
jobs = 0
reports = false
score = false

[tool.pylint."messages control"]
disable = ["all"]
enable = [
  "too-many-arguments",
  "too-many-locals",
  "too-many-branches",
  "too-many-statements",
  "too-many-return-statements",
  "too-many-instance-attributes",
  "too-many-public-methods",
  "too-few-public-methods",
  "too-many-ancestors",
  "duplicate-code",
  "cyclic-import",
]

[tool.pylint.design]
max-args = 6
max-locals = 20
max-branches = 15
max-statements = 60
max-returns = 6
max-attributes = 10
min-public-methods = 1
max-public-methods = 20
max-parents = 7